<!DOCTYPE html>
<html lang="es">

<head>
    <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm"
      }
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Trans Services A&B</title>
    <link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TRANS SERVICES A&B" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1E40AF">
    <link rel="manifest" href="./assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/trans-services-tokens.css">
    <link rel="stylesheet" href="../../assets/css/trans-services-components.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="../../assets/js/trans-services-ui.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../assets/js/trans-services-tailwind-config.js"></script>
</head>

<body class="bg-surface min-h-screen flex flex-col font-sans">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="main-content" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <img src="./assets/logo.png" alt="Logo Trans Services A&B" class="h-14 mx-auto mb-4">
                <h1 class="text-[28px] font-bold text-strong">Iniciar Sesión</h1>
                <p class="text-[15px] text-muted mt-1">Gerenciamiento de Viajes</p>
            </div>

            <div class="card p-6">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="label" for="email">Correo Electrónico</label>
                        <input type="email" id="email" required 
                            class="apple-input" 
                            placeholder="correo@ejemplo.com"
                            autocomplete="email">
                    </div>
                    
                    <div>
                        <label class="label" for="password">Contraseña</label>
                        <input type="password" id="password" required 
                            class="apple-input" 
                            placeholder="••••••••"
                            autocomplete="current-password">
                    </div>

                    <button type="button" onclick="resetPassword()"
                        class="text-primary text-[14px] font-medium w-full text-right hover:underline">
                        ¿Olvidaste tu contraseña?
                    </button>

                    <div id="errorMessage" class="text-danger text-[14px] text-center hidden p-3 bg-danger-soft rounded-xl" role="alert"></div>

                    <button type="submit" id="loginBtn"
                        class="btn btn-primary w-full mt-2">
                        <span id="btnText">Iniciar Sesión</span>
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-[14px] text-muted">
                        ¿No tienes cuenta? 
                        <a href="register.html" class="text-primary font-semibold hover:underline">Regístrate</a>
                    </p>
                </div>
            </div>

            <div class="mt-8 text-center">
                <p class="text-[12px] text-muted">
                    Trans Services A&B &copy; 2026
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { signIn, getCurrentUser, getCurrentProfile, isAdmin } from './js/supabase-client.js';

        lucide.createIcons();

        // Verificar sesión SOLO si hay usuario válido (no sesión fantasma)
        (async () => {
            try {
                const user = await getCurrentUser();
                if (!user) return; // No hay sesión, mostrar login
                
                const profile = await getCurrentProfile();
                if (profile && profile.rol) {
                    const redirect = profile.rol === 'admin' ? 'admin_trips.html' : 'index.html';
                    window.location.replace(redirect);
                }
            } catch (e) {
                // No hay sesión válida, mostrar login normalmente
                console.log('No hay sesión activa');
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const errorEl = document.getElementById('errorMessage');

            try {
                btn.disabled = true;
                btn.classList.add('opacity-70');
                btnText.innerHTML = '<i class="animate-spin w-5 h-5" data-lucide="loader-2"></i>';
                lucide.createIcons();
                errorEl.classList.add('hidden');

                await signIn(email, password);
                const profile = await getCurrentProfile();
                const redirect = (await isAdmin()) ? 'admin_trips.html' : 'index.html';
                window.location.replace(redirect);

            } catch (error) {
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                btnText.innerText = 'Iniciar Sesión';
                errorEl.textContent = error.message || 'Error desconocido al iniciar sesión';
                errorEl.classList.remove('hidden');
            }
        });

        window.resetPassword = async function() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                TS.toastWarning('Ingresa tu correo electrónico');
                return;
            }
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;
            btnText.innerHTML = 'Enviando... <i class="animate-spin w-4 h-4" data-lucide="loader-2"></i>';
            lucide.createIcons();

            try {
                const { supabase: sb } = await import('./js/supabase-client.js');
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/viajes/index.html`
                });
                if (error) throw error;
                TS.toastSuccess('Se ha enviado un correo de recuperación a tu bandeja');
            } catch (error) {
                TS.toastError('Error: ' + (error.message || 'No se pudo enviar el correo'));
            } finally {
                btnText.innerText = originalText;
            }
        };
    </script>
</body>

</html>
