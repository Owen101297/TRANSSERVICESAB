    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Save, History, PlusCircle, CheckCircle, AlertTriangle, Wifi, WifiOff, Truck, User, Calendar, Cloud, CloudOff, RefreshCw, FileDown, Trash2, CheckSquare, PenTool, Eraser, FileText, Lock, LogOut, Clock, Gauge } from 'lucide-react';

        const getSupabaseConfig = () => {
            if (typeof import.meta !== 'undefined' && import.meta.env) {
                const url = import.meta.env.VITE_SUPABASE_URL
                const key = import.meta.env.VITE_SUPABASE_ANON_KEY
                if (url && key) return { url, key }
            }
            return {
                url: 'https://xftllyjjqvozjjmgwomg.supabase.co',
                key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmdGxseWpqcXZvempqbWd3b21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjExMTIsImV4cCI6MjA5Mzc5NzExMn0.UURzZOytfoYMrxzpohRams_GcJ3ETsEnNNOaSQqeuu8'
            }
        }

        const { url: SUPABASE_URL, key: SUPABASE_KEY } = getSupabaseConfig()

        const loadScript = (src) => new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) return resolve()
            const s = document.createElement('script')
            s.src = src
            s.onload = () => resolve()
            s.onerror = (e) => reject(new Error(`Failed to load script: ${src}`))
            document.body.appendChild(s)
        })

        let supabase = null

        const initSupabase = async () => {
            try {
                await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js')
                if (!window.supabase) throw new Error("Supabase script was loaded but window.supabase is undefined")
                const { createClient } = window.supabase
                supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
                return supabase
            } catch (e) {
                console.error("Error al inicializar Supabase client:", e)
                return null
            }
        }

        // initSupabase se llamará únicamente bajo demanda en checkSession para evitar condiciones de carrera

        let currentUser = null

        const SECTIONS = {
            parteA: { title: "A. PARTE EXTERNA", items: ["Vidrios (parabrisas, laterales, trasero)", "Puertas, chapas, manijas, compuerta", "Llantas (traseras, delanteras, repuesto)", "Rines y tuercas", "Espejos retrovisores laterales"] },
            parteB: { title: "B. PARTE INTERNA", items: ["Manijas, seguros y pasamanos", "Freno de seguridad (funcionalidad)", "Tablero de instrumentos (funcionamiento)", "Mando luces, limpiabrisas, pedales", "Espejo retrovisor interno", "Pito / Bocina", "Cinturones de Seguridad (3 puntos)"] },
            parteC: { title: "C. COMPARTIMIENTO MOTOR", items: ["Nivel de aceite motor", "Nivel de refrigerante", "Nivel aceite hidráulico dirección", "Nivel líquido de frenos", "Nivel fluido lavaparabrisas", "Estado y tensión de correas", "Baterías / Bornes / Nivel ácido / Soporte"] },
            parteD: { title: "D. SEGURIDAD ACTIVA", items: ["Frenos de servicio y ABS", "Cámara / Sensores de reversa", "Alarma sonora de reversa"] },
            parteE: { title: "E. DISPOSITIVOS ÓPTICOS", items: ["Luces de navegación: altas y bajas", "Luces de posición (cocuyos)", "Luces direccionales y parqueo", "Luces de frenado (Stop)", "Luz de reversa", "Luz antineblina (exploradoras)"] },
            parteF: { title: "F. EMERGENCIAS", items: ["Kit de carretera (completo)", "Extintor (carga vigente)", "Kit ambiental", "Botiquín"] },
            parteG: { title: "G. CONDUCTOR", items: ["Test de Fatiga (Descanso adecuado)", "Documentación al día (Licencia/Seguros)"] }
        };

        const getLocalDateString = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const INITIAL_FORM = { fecha: getLocalDateString(), hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), placa: '', kilometraje: '', conductor: '', checks: {}, observaciones: '', firmaConductor: null };

        const normalizePlaca = (placa) => {
            if (!placa) return '';
            const cleaned = String(placa).replace(/[^A-Z0-9]/gi, '').toUpperCase();
            if (cleaned.length === 6) {
                return cleaned.slice(0, 3) + '-' + cleaned.slice(3);
            }
            return cleaned;
        };

        function App() {
            const [view, setView] = useState('loading'); // 'loading', 'login', 'form', 'history', 'reports'
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [currentForm, setCurrentForm] = useState(INITIAL_FORM);
            const [history, setHistory] = useState([]);
            const [activeSection, setActiveSection] = useState('parteA');
            const [notification, setNotification] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [errors, setErrors] = useState({});
            const [logoData, setLogoData] = useState(null);
            const [conductorId, setConductorId] = useState(null);
            const [omittedItemId, setOmittedItemId] = useState(null);
            const [lastKilometraje, setLastKilometraje] = useState(0);
            
            // Credenciales de Login
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const placaRef = useRef(null);
            const conductorRef = useRef(null);
            const touchStartX = useRef(null);

            const [reportConfig, setReportConfig] = useState({ month: new Date().getMonth(), year: new Date().getFullYear(), placa: '' });

            useEffect(() => {
                const loadDependencies = async () => {
                    try {
                        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
                        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js");
                    } catch (e) {
                        console.warn("No se pudieron cargar las dependencias de PDF:", e);
                    }
                };
                loadDependencies();

                const img = new Image(); 
                img.onload = () => { 
                    try {
                        const c = document.createElement('canvas'); 
                        c.width = img.width; 
                        c.height = img.height; 
                        const x = c.getContext('2d'); 
                        x.drawImage(img, 0, 0); 
                        setLogoData(c.toDataURL('image/png')); 
                    } catch (e) {
                        console.error("Error al procesar logo en canvas:", e);
                    }
                };
                const logoCandidates = [
                    window.location.origin + '/assets/logo.png',
                    window.location.origin + '/logo.png'
                ];
                img.onerror = () => {
                    const idx = logoCandidates.indexOf(img.src);
                    if (idx > -1 && idx < logoCandidates.length - 1) {
                        img.src = logoCandidates[idx + 1];
                    } else {
                        console.error("Error al cargar logo.png:", img.src);
                    }
                };
                img.src = logoCandidates[0];
            }, []);

            // Verificar sesión activa
            const checkSession = async () => {
                try {
                    const client = await initSupabase();
                    supabase = client;
                    if (supabase) {
                        const { data: { session } } = await supabase.auth.getSession();
                        if (session) {
                            currentUser = session.user;
                            await loadDriverProfile(currentUser.email);
                            setView('form');
                            // Limpiar hash de OAuth de la URL
                            if (window.location.hash) {
                                window.history.replaceState(null, null, window.location.pathname + window.location.search);
                            }
                        } else {
                            // Verificar si venimos de un callback de OAuth (Google/Gmail)
                            const isOAuthCallback = window.location.hash.includes('access_token=') || window.location.search.includes('code=');
                            
                            if (isOAuthCallback) {
                                // Escuchar el cambio de estado de autenticación (el callback resolverá de forma asíncrona)
                                const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, currentSession) => {
                                    if (currentSession) {
                                        currentUser = currentSession.user;
                                        await loadDriverProfile(currentUser.email);
                                        setView('form');
                                        // Limpiar hash de OAuth de la URL
                                        window.history.replaceState(null, null, window.location.pathname + window.location.search);
                                        subscription?.unsubscribe();
                                    }
                                });
                                
                                // Si en 6 segundos no se resuelve, ir a login por seguridad
                                setTimeout(() => {
                                    setView(prev => prev === 'loading' ? 'login' : prev);
                                }, 6000);
                            } else {
                                setView('login');
                            }
                        }
                    } else {
                        setView('login');
                    }
                } catch (err) {
                    console.error("Error en checkSession:", err);
                    setView('login');
                }
            };

            const loadDriverProfile = async (userEmail) => {
                try {
                    const { data: conductor } = await supabase
                        .from('conductores')
                        .select('*')
                        .eq('email', userEmail)
                        .maybeSingle();
                        
                    if (conductor) {
                        const nombreCompleto = `${conductor.nombres} ${conductor.apellidos}`;
                        setConductorId(conductor.id);
                        
                        // Cargar historial y borrador específico del conductor (Aislamiento de datos)
                        const userHistoryKey = `inspectionHistory_${userEmail}`;
                        const userDraftKey = `currentDraft_${userEmail}`;
                        
                        const saved = localStorage.getItem(userHistoryKey);
                        if (saved) {
                            setHistory(JSON.parse(saved));
                        } else {
                            setHistory([]);
                        }
                        
                        const draft = localStorage.getItem(userDraftKey);
                        if (draft) {
                            setCurrentForm(JSON.parse(draft));
                        } else {
                            // Obtener última placa registrada de Supabase para este conductor
                            const { data: lastPreop } = await supabase
                                .from('flota.inspecciones')
                                .select('vehiculo_placa')
                                .eq('conductor_id', conductor.id)
                                .order('created_at', { ascending: false })
                                .limit(1)
                                .maybeSingle();

                            setCurrentForm({
                                ...INITIAL_FORM,
                                conductor: nombreCompleto,
                                placa: lastPreop ? normalizePlaca(lastPreop.vehiculo_placa) : ''
                            });
                        }
                    } else {
                        // Conductor no registrado en la tabla 'conductores' (ej. Administrador o cuenta sin asociar)
                        const userHistoryKey = `inspectionHistory_${userEmail}`;
                        const userDraftKey = `currentDraft_${userEmail}`;
                        
                        const saved = localStorage.getItem(userHistoryKey);
                        setHistory(saved ? JSON.parse(saved) : []);
                        
                        const draft = localStorage.getItem(userDraftKey);
                        setCurrentForm(draft ? JSON.parse(draft) : {
                            ...INITIAL_FORM,
                            conductor: userEmail
                        });
                    }
                } catch (e) {
                    console.error('Error al cargar perfil:', e);
                }
            };

            const fetchLastKilometraje = async (vehiclePlaca) => {
                if (!supabase || !vehiclePlaca) return;
                try {
                    const cleanPlaca = normalizePlaca(vehiclePlaca);
                    const { data, error } = await supabase
                        .from('flota.inspecciones')
                        .select('kilometraje')
                        .eq('vehiculo_placa', cleanPlaca)
                        .order('created_at', { ascending: false })
                        .limit(1)
                        .maybeSingle();
                    
                    if (data && data.kilometraje) {
                        setLastKilometraje(Number(data.kilometraje));
                    } else {
                        setLastKilometraje(0);
                    }
                } catch (e) {
                    console.error("Error al obtener último kilometraje:", e);
                }
            };

            useEffect(() => {
                if (currentForm.placa) {
                    fetchLastKilometraje(currentForm.placa);
                } else {
                    setLastKilometraje(0);
                }
            }, [currentForm.placa]);

            useEffect(() => {
                window.addEventListener('online', () => setIsOnline(true))
                window.addEventListener('offline', () => setIsOnline(false))
                
                checkSession();
            }, []);

            useEffect(() => { 
                if (view !== 'loading' && view !== 'login' && currentUser) {
                    const userDraftKey = `currentDraft_${currentUser.email}`;
                    localStorage.setItem(userDraftKey, JSON.stringify(currentForm)); 
                }
            }, [currentForm, view]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!email.trim() || !password.trim()) {
                    showNotification('Ingrese email y contraseña', 'error');
                    return;
                }
                setAuthLoading(true);
                vibrate();
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email.trim(),
                        password: password.trim()
                    });
                    if (error) throw error;
                    
                    currentUser = data.user;
                    await loadDriverProfile(currentUser.email);
                    showNotification('Ingreso Exitoso', 'success');
                    setView('form');
                } catch (e) {
                    showNotification(e.message || 'Error de autenticación', 'error');
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleGoogleLogin = async () => {
                setAuthLoading(true);
                vibrate();
                try {
                    const { error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + window.location.pathname
                        }
                    });
                    if (error) throw error;
                } catch (e) {
                    showNotification(e.message || 'Error al iniciar sesión con Google', 'error');
                    setAuthLoading(false);
                }
            };

            const handleLogout = async () => {
                if (!(await TS.confirm('¿Desea cerrar la sesión activa?'))) return;
                vibrate();
                try {
                    const userEmail = currentUser?.email;
                    await supabase.auth.signOut();
                    
                    // Limpiar estados locales en memoria para evitar leaks de datos
                    currentUser = null;
                    setConductorId(null);
                    setHistory([]);
                    setCurrentForm(INITIAL_FORM);
                    
                    if (userEmail) {
                        const userDraftKey = `currentDraft_${userEmail}`;
                        localStorage.removeItem(userDraftKey);
                    }
                    
                    showNotification('Sesión Cerrada', 'success');
                    setView('login');
                } catch (e) {
                    showNotification('Error al cerrar sesión', 'error');
                }
            };

            const vibrate = (ms = 10) => { 
                if (navigator.vibrate) navigator.vibrate(ms); 
            };
            
            const showNotification = (msg, type) => { 
                setNotification({ msg, type }); 
                setTimeout(() => setNotification(null), 3000);
            };
            
            const handleInputChange = (e) => { 
                const { name, value } = e.target; 
                setCurrentForm(prev => ({ ...prev, [name]: value }));
            };
            
            const handleCheck = (sec, idx, status) => { 
                vibrate(); 
                setCurrentForm(prev => ({ 
                    ...prev, 
                    checks: { ...(prev.checks || {}), [`${sec}-${idx}`]: status } 
                })); 
                if (omittedItemId === `${sec}-${idx}`) {
                    setOmittedItemId(null);
                }
            };
            
            const markSectionAllGood = () => { 
                vibrate(20); 
                const newChecks = { ...(currentForm.checks || {}) }; 
                SECTIONS[activeSection].items.forEach((_, i) => newChecks[`${activeSection}-${i}`] = 'B'); 
                setCurrentForm(prev => ({ ...prev, checks: newChecks })); 
                showNotification("Sección completada", "success"); 
            };
            
            const calculateProgress = () => { 
                const total = Object.values(SECTIONS).reduce((acc, s) => acc + s.items.length, 0); 
                return Math.round((Object.keys(currentForm.checks || {}).length / total) * 100); 
            };

            const getFailedItems = () => {
                const failed = [];
                Object.keys(SECTIONS).forEach(secKey => {
                    SECTIONS[secKey].items.forEach((item, idx) => {
                        if (currentForm.checks[`${secKey}-${idx}`] === 'M') {
                            failed.push({
                                section: SECTIONS[secKey].title,
                                item: item,
                                key: `${secKey}-${idx}`
                            });
                        }
                    });
                });
                return failed;
            };

            // Touch Swipe Gesture Recognizer for Steps
            const handleTouchStart = (e) => {
                touchStartX.current = e.touches[0].clientX;
            };

            const handleTouchEnd = (e) => {
                if (touchStartX.current === null) return;
                const touchEndX = e.changedTouches[0].clientX;
                const diffX = touchStartX.current - touchEndX;
                
                // threshold of 60px
                if (Math.abs(diffX) > 60) {
                    const keys = Object.keys(SECTIONS);
                    const currentIndex = keys.indexOf(activeSection);
                    
                    if (diffX > 0) {
                        // Swipe Left -> Next Section
                        if (currentIndex < keys.length - 1) {
                            vibrate(20);
                            setActiveSection(keys[currentIndex + 1]);
                        }
                    } else {
                        // Swipe Right -> Previous Section
                        if (currentIndex > 0) {
                            vibrate(20);
                            setActiveSection(keys[currentIndex - 1]);
                        }
                    }
                }
                touchStartX.current = null;
            };

            // Canvas Signature
            const startDrawing = (e) => { 
                const { offsetX, offsetY } = getCoords(e.nativeEvent); 
                const ctx = canvasRef.current.getContext('2d'); 
                ctx.strokeStyle = '#D4AF37'; 
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath(); 
                ctx.moveTo(offsetX, offsetY); 
                setIsDrawing(true); 
            };
            
            const draw = (e) => { 
                if (!isDrawing) return; 
                const { offsetX, offsetY } = getCoords(e.nativeEvent); 
                const ctx = canvasRef.current.getContext('2d'); 
                ctx.lineTo(offsetX, offsetY); 
                ctx.stroke(); 
            };
            
            const stopDrawing = () => { 
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d'); 
                ctx.closePath(); 
                setIsDrawing(false); 
                setCurrentForm(prev => ({ ...prev, firmaConductor: canvasRef.current.toDataURL() })); 
            };
            
            const getCoords = (e) => { 
                if (e.touches && e.touches[0]) { 
                    const r = canvasRef.current.getBoundingClientRect(); 
                    return { 
                        offsetX: e.touches[0].clientX - r.left, 
                        offsetY: e.touches[0].clientY - r.top 
                    }; 
                } 
                return { offsetX: e.offsetX, offsetY: e.offsetY }; 
            };
            
            const clearSignature = () => { 
                const ctx = canvasRef.current.getContext('2d'); 
                ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); 
                setCurrentForm(prev => ({ ...prev, firmaConductor: null })); 
            };

            const validateForm = () => {
                const err = {}; 
                let valid = true;
                if (!currentForm.placa.trim()) { 
                    err.placa = true; 
                    valid = false; 
                    placaRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                }
                if (!currentForm.conductor.trim()) { 
                    err.conductor = true; 
                    valid = false; 
                    if (!err.placa) conductorRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                }
                setErrors(err); 
                if (!valid) {
                    setTimeout(() => setErrors({}), 2000); 
                    return false;
                }

                // Odometer telemetry verification
                if (currentForm.kilometraje && lastKilometraje > 0 && Number(currentForm.kilometraje) < lastKilometraje) {
                    showNotification(`El kilometraje no puede ser inferior al último registrado (${lastKilometraje.toLocaleString()} km)`, "error");
                    vibrate([50, 50]);
                    return false;
                }

                // HSEQ Checklist Validation: Ensure all checklist items are answered B or M
                let firstOmittedSec = null;
                let firstOmittedIdx = null;

                for (const secKey of Object.keys(SECTIONS)) {
                    const items = SECTIONS[secKey].items;
                    for (let idx = 0; idx < items.length; idx++) {
                        if (!currentForm.checks[`${secKey}-${idx}`]) {
                            firstOmittedSec = secKey;
                            firstOmittedIdx = idx;
                            break;
                        }
                    }
                    if (firstOmittedSec !== null) break;
                }

                if (firstOmittedSec !== null) {
                    valid = false;
                    const targetId = `${firstOmittedSec}-${firstOmittedIdx}`;
                    setActiveSection(firstOmittedSec);
                    setOmittedItemId(targetId);
                    
                    showNotification("Por favor califique todos los ítems de la sección", "error");
                    vibrate([50, 50]);
                    
                    setTimeout(() => {
                        const element = document.getElementById(`item-container-${targetId}`);
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 150);

                    setTimeout(() => {
                        setOmittedItemId(null);
                    }, 4000);
                }

                return valid;
            };

            const syncRecordToSupabase = async (rec) => {
                if (!supabase) return false
                try {
                    const cleanPlaca = normalizePlaca(rec.placa);
                    rec.placa = cleanPlaca; // Normalize local state in-place
                    const { synced, id, ...data } = rec
                    data.placa = cleanPlaca;
                    
                    const { data: vehiculo } = await supabase
                        .from('vehiculos')
                        .select('id')
                        .ilike('placa', cleanPlaca)
                        .maybeSingle();

                    // Check if this inspection already exists in Supabase to prevent duplicate inserts in the cloud
                    let existingRemote = null;
                    if (supabase) {
                        let query = supabase
                            .from('flota.inspecciones')
                            .select('id')
                            .eq('fecha', data.fecha);

                        query = query.eq('vehiculo_placa', cleanPlaca);

                        if (conductorId) {
                            query = query.eq('conductor_id', conductorId);
                        } else if (data.conductor) {
                            query = query.eq('conductor_nombre', data.conductor);
                        }

                        const { data: existingList } = await query.limit(1);
                        if (existingList && existingList.length > 0) {
                            existingRemote = existingList[0];
                        }
                    }

                    if (existingRemote) {
                        rec.id = existingRemote.id;
                        return true;
                    }

                    // Check for HSEQ Option 2 failures: if any item is marked as 'M' (Malo)
                    const hasMalo = Object.values(data.checks || {}).some(val => val === 'M');
                    const finalObs = (hasMalo ? '[NOVEDADES DETECTADAS] ' : '') + data.observaciones + (data.kilometraje ? ` (Kilometraje: ${data.kilometraje})` : '');
                    const finalEstado = hasMalo ? 'con_novedades' : 'completado';

                    const { data: insertedData, error } = await supabase
                        .from('flota.inspecciones')
                        .insert({
                            fecha: data.fecha,
                            conductor_id: conductorId || null,
                            conductor_nombre: data.conductor,
                            vehiculo_id: vehiculo ? vehiculo.id : null,
                            vehiculo_placa: cleanPlaca,
                            kilometraje: data.kilometraje ? parseInt(data.kilometraje, 10) || null : null,
                            checklist: data.checks,
                            firma: data.firmaConductor,
                            observaciones: finalObs,
                            estado: finalEstado
                        })
                        .select()
                        .maybeSingle();

                    if (error) throw error
                    if (insertedData) {
                        rec.id = insertedData.id;
                    }
                    return true
                } catch (e) {
                    console.error(e)
                    return false
                }
            };

            const triggerSync = async () => {
                if (!isOnline) return showNotification('Sin conexión', 'error')
                if (!supabase) await initSupabase()
                setIsSyncing(true)
                let updated = [...history]
                let count = 0
                for (const r of updated.filter(x => !x.synced)) {
                    if (await syncRecordToSupabase(r)) {
                        r.synced = true
                        count++
                    }
                }
                
                try {
                    const identifier = conductorId || (currentUser && currentUser.email);
                    if (supabase && identifier) {
                        let query = supabase
                            .from('flota.inspecciones')
                            .select('*')
                            .order('created_at', { ascending: false })
                            .limit(30);

                        if (conductorId) {
                            query = query.eq('conductor_id', conductorId);
                        } else {
                            query = query.eq('conductor_nombre', identifier);
                        }

                        const { data: remoteData } = await query;
                        
                        if (remoteData) {
                            const localIds = new Set(updated.map(r => r.id));
                            
                            const newOnes = remoteData.filter(r => {
                                // Prevent duplication by exact database ID match
                                if (localIds.has(r.id)) return false;
                                
                                // Prevent duplication by checking if a local record already exists for the same plate and date
                                const duplicateMatch = updated.find(x => 
                                    normalizePlaca(x.placa) === normalizePlaca(r.vehiculo_placa) && 
                                    String(x.fecha || '').trim() === String(r.fecha || '').trim()
                                );
                                
                                if (duplicateMatch) {
                                    // If local match exists but lacks the Supabase database ID, link them together and mark as synced
                                    if (duplicateMatch.id !== r.id) {
                                        duplicateMatch.id = r.id;
                                        duplicateMatch.synced = true;
                                    }
                                    return false;
                                }
                                return true;
                            });

                            if (newOnes.length > 0) {
                                updated = [...updated, ...newOnes.map(r => ({
                                    id: r.id,
                                    fecha: r.fecha,
                                    placa: normalizePlaca(r.vehiculo_placa),
                                    conductor: r.conductor_nombre,
                                    kilometraje: r.kilometraje || '',
                                    checks: r.checklist || {},
                                    observaciones: r.observaciones || '',
                                    firmaConductor: r.firma || null,
                                    synced: true
                                }))].sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
                            }
                        }
                    }
                } catch (e) { console.error(e) }
                
                // Pruning existing local duplicates in history (by placa + fecha)
                const uniqueHistory = [];
                const seenKeys = new Set();
                
                for (const item of updated) {
                    const key = `${normalizePlaca(item.placa)}-${item.fecha}`;
                    if (!seenKeys.has(key)) {
                        seenKeys.add(key);
                        uniqueHistory.push(item);
                    } else {
                        const existing = uniqueHistory.find(x => 
                            normalizePlaca(x.placa) === normalizePlaca(item.placa) && 
                            String(x.fecha || '').trim() === String(item.fecha || '').trim()
                        );
                        if (existing) {
                            if (typeof existing.id === 'number' && typeof item.id === 'string') {
                                existing.id = item.id;
                                existing.synced = true;
                            } else if (!existing.synced && item.synced) {
                                existing.id = item.id;
                                existing.synced = true;
                            }
                        }
                    }
                }
                updated = uniqueHistory;
                
                setHistory(updated)
                if (currentUser) {
                    const userHistoryKey = `inspectionHistory_${currentUser.email}`;
                    localStorage.setItem(userHistoryKey, JSON.stringify(updated))
                }
                setIsSyncing(false)
                showNotification(count > 0 ? `Sincronizados: ${count}` : 'Actualizado', 'success')
            };

            const saveInspection = async () => {
                if (!validateForm()) return vibrate([50, 50])
                const normalizedPlaca = normalizePlaca(currentForm.placa);
                const newRec = { ...currentForm, placa: normalizedPlaca, id: Date.now(), synced: false, timestamp: new Date().toISOString() }
                let synced = false
                if (isOnline && supabase) {
                    setIsSyncing(true)
                    synced = await syncRecordToSupabase(newRec)
                    setIsSyncing(false)
                }
                const finalRec = { ...newRec, synced }
                const newHist = [finalRec, ...history]
                setHistory(newHist)
                
                if (currentUser) {
                    const userHistoryKey = `inspectionHistory_${currentUser.email}`;
                    const userDraftKey = `currentDraft_${currentUser.email}`;
                    localStorage.setItem(userHistoryKey, JSON.stringify(newHist))
                    localStorage.removeItem(userDraftKey)
                }
                
                setCurrentForm({ ...INITIAL_FORM, placa: normalizedPlaca, conductor: currentForm.conductor })
                if (canvasRef.current) clearSignature()
                showNotification(synced ? 'Guardado y Subido' : 'Guardado (Pendiente)', 'success')
                setView('history')
            };

               const generatePDF = async () => {
                if (!window.jspdf) return showNotification("Error motor PDF", "error");
                
                const { month, year, placa } = reportConfig;
                let data = [];
                
                showNotification("Generando reporte...", "info");
                
                // 1. Query Supabase directly for unlimited, robust monthly historical data
                if (isOnline && supabase) {
                    try {
                        const startDate = `${year}-${String(Number(month) + 1).padStart(2, '0')}-01`;
                        const endDate = new Date(year, Number(month) + 1, 0).toISOString().split('T')[0];
                        
                        let query = supabase
                            .from('flota.inspecciones')
                            .select('*')
                            .gte('fecha', startDate)
                            .lte('fecha', endDate);
                        
                        if (conductorId) {
                            query = query.eq('conductor_id', conductorId);
                        } else if (currentUser && currentUser.email) {
                            query = query.eq('conductor_nombre', currentUser.email);
                        }
                        
                        if (placa) {
                            query = query.eq('vehiculo_placa', normalizePlaca(placa));
                        }
                        
                        const { data: remoteRecords, error } = await query.order('fecha', { ascending: true });
                        if (error) throw error;
                        
                        if (remoteRecords) {
                            data = remoteRecords.map(r => ({
                                id: r.id,
                                fecha: r.fecha,
                                placa: normalizePlaca(r.vehiculo_placa),
                                conductor: r.conductor_nombre,
                                kilometraje: r.kilometraje || '',
                                checks: r.checklist || {},
                                observaciones: r.observaciones || '',
                                firmaConductor: r.firma || null,
                                synced: true
                            }));
                        }
                    } catch (e) {
                        console.error("Error al obtener reportes de Supabase:", e);
                    }
                }
                
                // 2. Local fallback if offline or no remote records are found
                if (data.length === 0) {
                    data = history.filter(r => {
                        const d = new Date(r.fecha + 'T12:00:00');
                        return d.getMonth() == month && d.getFullYear() == year && (!placa || normalizePlaca(r.placa) === normalizePlaca(placa));
                    });
                }
                
                if (data.length === 0) return showNotification("No hay datos para este filtro", "warning");
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
                const m = 8;
                const w = 279.4 - (m * 2);

                // --- 1. HEADER ---
                doc.setLineWidth(0.3);
                doc.setDrawColor(0);
                doc.setTextColor(0);

                doc.rect(m, m, w, 24);
                const logoW = 45;
                const isoW = 45;
                doc.line(m + logoW, m, m + logoW, m + 24);
                doc.line(m + w - isoW, m, m + w - isoW, m + 24);

                let currentLogo = logoData;
                if (!currentLogo) {
                    try {
                        currentLogo = await new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => {
                                try {
                                    const c = document.createElement('canvas');
                                    c.width = img.width;
                                    c.height = img.height;
                                    const x = c.getContext('2d');
                                    x.drawImage(img, 0, 0);
                                    resolve(c.toDataURL('image/png'));
                                } catch (e) {
                                    console.error("Error al convertir logo dinámico a data URL:", e);
                                    resolve(null);
                                }
                            };
                            const logoCandidates2 = [
                                window.location.origin + '/assets/logo.png',
                                window.location.origin + '/logo.png'
                            ];
                            img.onerror = (err) => {
                                const idx = logoCandidates2.indexOf(img.src);
                                if (idx > -1 && idx < logoCandidates2.length - 1) {
                                    img.src = logoCandidates2[idx + 1];
                                } else {
                                    console.error("Error al cargar logo dinámicamente:", img.src);
                                    resolve(null);
                                }
                            };
                            img.src = logoCandidates2[0];
                        });
                    } catch (e) {
                        console.warn("Error cargando logo en el generador de PDF:", e);
                    }
                }

                if (currentLogo) { 
                    try { 
                        doc.addImage(currentLogo, 'PNG', m + 5, m + 2, 35, 20, undefined, 'FAST'); 
                    } catch (e) { 
                        console.error("Error al pintar logo en jsPDF:", e);
                        doc.setFontSize(10); 
                        doc.text("LOGO", m + 15, m + 15); 
                    } 
                } else { 
                    doc.setFontSize(10); 
                    doc.text("LOGO", m + 15, m + 15); 
                }

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                const titleX = m + logoW + ((w - logoW - isoW) / 2);
                doc.text("INSPECCION PREOPERACIONAL DE", titleX, m + 8, { align: 'center' });
                doc.text("VEHÍCULOS DE SERVICIO ESPECIAL", titleX, m + 14, { align: 'center' });
                doc.text("DE PASAJEROS", titleX, m + 20, { align: 'center' });

                doc.setFontSize(7);
                doc.text("CÓDIGO: IMTO-F-010", m + w - isoW + 2, m + 6);
                doc.line(m + w - isoW, m + 8, m + w, m + 8);
                doc.text("VERSIÓN: 04", m + w - isoW + 2, m + 14);
                doc.line(m + w - isoW, m + 16, m + w, m + 16);
                doc.text("FECHA: 2025/08/26", m + w - isoW + 2, m + 22);

                doc.setFontSize(9);
                doc.text(`PLACA: ${placa || 'VARIAS'}`, m, m + 30);
                doc.text(`MES: ${parseInt(month) + 1}`, m + 50, m + 30);
                doc.text(`AÑO: ${year}`, m + 80, m + 30);
                doc.text("UBICACIÓN: (Varios)", m + 120, m + 30);

                // --- 2. DATA MAPPING ---
                const map = {};
                let lastSignature = null;
                data.forEach(r => {
                    const day = new Date(r.fecha + 'T12:00:00').getDate();
                    Object.keys(r.checks).forEach(k => { 
                        if (!map[k]) map[k] = {}; 
                        map[k][day] = r.checks[k]; 
                    });
                    if (r.firmaConductor) lastSignature = r.firmaConductor;
                });

                const body = [];
                Object.keys(SECTIONS).forEach(secKey => {
                    body.push([{ content: SECTIONS[secKey].title, colSpan: 32, styles: { fillColor: [240, 240, 240], fontStyle: 'bold', halign: 'center' } }]);
                    SECTIONS[secKey].items.forEach((itemText, idx) => {
                        const row = [itemText];
                        for (let d = 1; d <= 31; d++) {
                            row.push(map[`${secKey}-${idx}`]?.[d] || '');
                        }
                        body.push(row);
                    });
                });

                // --- 3. TABLE GENERATION ---
                doc.autoTable({
                    startY: m + 32,
                    head: [
                        [{ content: 'ITEM A INSPECCIONAR', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } }, ...Array.from({ length: 31 }, (_, i) => ({ content: `${i + 1}`, styles: { halign: 'center' } }))],
                        [...Array.from({ length: 31 }, () => ({ content: 'B/M', styles: { halign: 'center', fontSize: 4, textColor: 100 } }))]
                    ],
                    body: body,
                    theme: 'grid',
                    styles: {
                        fontSize: 5,
                        cellPadding: 0.6,
                        lineColor: 0,
                        lineWidth: 0.1,
                        textColor: 0,
                        font: "helvetica"
                    },
                    headStyles: {
                        fillColor: 255,
                        textColor: 0,
                        lineWidth: 0.1,
                        lineColor: 0,
                        fontStyle: 'bold'
                    },
                    columnStyles: {
                        0: { cellWidth: 55 }
                    },
                    didParseCell: (data) => {
                        if (data.section === 'body' && data.column.index > 0 && data.cell.raw === 'M') {
                            data.cell.styles.textColor = [200, 0, 0];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    },
                    margin: { left: m, right: m }
                });

                // --- 4. FOOTER & SIGNATURES ---
                let finalY = doc.lastAutoTable.finalY + 3;
                if (finalY > 190) { doc.addPage(); finalY = 10; }

                doc.setFontSize(7);
                doc.text("Nota: B=Bueno, M=Malo. Marque con X o letra.", m, finalY);
                finalY += 4;

                const boxW = 60;
                const boxH = 15;

                doc.rect(m, finalY, boxW, boxH);
                if (lastSignature) {
                    try { doc.addImage(lastSignature, 'PNG', m + 5, finalY + 1, boxW - 10, boxH - 2); } catch (e) { }
                }
                doc.text("Firma del Conductor", m, finalY + boxH + 4);

                doc.rect(m + boxW + 10, finalY, boxW, boxH);
                doc.text("Vo.Bo. Supervisor", m + boxW + 10, finalY + boxH + 4);

                doc.save(`Preoperacional_${placa || 'General'}_${month + 1}.pdf`);
                showNotification("PDF Descargado", "success");
            };
            const unsyncedCount = history.filter(x => !x.synced).length;

            return (

                                <div className="text-center">
                                    <h1 className="text-2xl font-black font-display text-gold tracking-widest">TRANS SERVICES A&B</h1>

                                                             placeholder="TODAS" 
                                                             value={reportConfig.placa} 
                                                             onChange={(e) => setReportConfig({ ...reportConfig, placa: e.target.value.toUpperCase() })} 
                                                             className="bg-transparent w-full font-black uppercase text-gold outline-none tracking-widest text-sm" 
                                                         />
                                                     </div>
                                                 </div>
                                             </div>

                                             {/* Report Details Preview */}
                                             <div className="p-4 rounded-xl bg-bg-2/50 border border-white/5 space-y-2">
                                                 <span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest block">Vista Previa de Configuración</span>
                                                 <div className="grid grid-cols-2 gap-y-1.5 text-xs">
                                                     <span className="text-slate-400">Archivo Destino:</span>
                                                     <span className="font-semibold text-slate-200 text-right">IMTO-F-010_Reporte.pdf</span>
                                                     <span className="text-slate-400">Orientación:</span>
                                                     <span className="font-semibold text-slate-200 text-right flex items-center justify-end gap-1">
                                                         <span className="inline-block w-2.5 h-1.5 border border-slate-300 rounded-sm bg-slate-400/20"></span>
                                                         Horizontal (Carta)
                                                     </span>
                                                     <span className="text-slate-400">Fuente de Datos:</span>
                                                     <span className="font-semibold text-emerald-400 text-right flex items-center justify-end gap-1">
                                                         <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                                         Supabase Cloud
                                                     </span>
                                                 </div>
                                             </div>
                                             
                                             <button 
                                                 onClick={generatePDF} 
                                                 className="w-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 tap-effect shadow-lg shadow-rose-950/40 border border-rose-500/20 mt-4 text-sm tracking-wide transition-all duration-300 transform active:scale-95"
                                             >
                                                 <FileDown size={20} /> DESCARGAR REPORTE CONSOLIDADO
                                             </button>
                                         </div>
                                     </div>
                                )}
                            </div>
                            
                            {/* Bottom Navigation Glassmorphism */}
                            <div className="fixed bottom-4 left-4 right-4 bg-bg-1/90 backdrop-blur-lg border border-white/5 shadow-2xl rounded-2xl flex justify-around p-2 z-50 max-w-2xl mx-auto">
                                <button 
                                    onClick={() => setView('form')} 
                                    className={`flex-1 flex flex-col items-center py-2 rounded-xl transition-all ${view === 'form' ? 'text-gold bg-white/[0.03]' : 'text-slate-500'}`}
                                >
                                    <PlusCircle size={22} />
                                    <span className="text-[9px] font-bold mt-1 uppercase tracking-wider">Nueva</span>
                                </button>
                                <button 
                                     onClick={() => setView('history')} 
                                     className={`flex-1 flex flex-col items-center py-2 rounded-xl transition-all relative ${view === 'history' ? 'text-gold bg-white/[0.03]' : 'text-slate-500'}`}
                                 >
                                     <div className="relative">
                                         <History size={22} />
                                         {unsyncedCount > 0 && (
                                             <span className="absolute -top-1.5 -right-2.5 bg-gold text-bg-1 text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center border border-bg-1 scale-90 animate-pulse">
                                                 {unsyncedCount}
                                             </span>
                                         )}
                                     </div>
                                     <span className="text-[9px] font-bold mt-1 uppercase tracking-wider">Historial</span>
                                 </button>
                                <button 
                                    onClick={() => setView('reports')} 
                                    className={`flex-1 flex flex-col items-center py-2 rounded-xl transition-all ${view === 'reports' ? 'text-gold bg-white/[0.03]' : 'text-slate-500'}`}
                                >
                                    <FileDown size={22} />
                                    <span className="text-[9px] font-bold mt-1 uppercase tracking-wider">Reportes</span>
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
